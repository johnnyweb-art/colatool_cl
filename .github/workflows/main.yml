name: 更新行程資料

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'stocktake.cjs'

permissions:
  contents: write
  pages: write

concurrency:
  group: update-index

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安裝瀏覽器
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: 盤點可樂官網行程
        run: node stocktake.cjs
      - name: 存回網站
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cola-index.js
          if git diff --cached --quiet; then echo "行程資料沒有變化"; exit 0; fi
          git commit -m "自動更新行程資料 $(TZ=Asia/Taipei date +%F)"
          git push
      - name: 重新發布網站
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
